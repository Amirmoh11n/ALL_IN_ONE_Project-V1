# Central configuration file for the Brain Tumor Classification project.
# All experiment-relevant numbers/settings should live here (never hardcoded in source).
#
# NOTE: This is a structural skeleton only. Sections are placeholders; concrete
# values (paths, hyperparameters, augmentation settings, etc.) are pending discussion.

data:
  # Local location of the raw dataset (relative to project root).
  raw_dir: "data/raw"
  train_dir_name: "Training"   # data/raw/Training
  test_dir_name: "Testing"     # data/raw/Testing (untouched, final evaluation only)

  # Source used to auto-download the dataset if raw_dir is empty/missing.
  kaggle:
    dataset_slug: "masoudnickparvar/brain-tumor-mri-dataset"
    # Auth is NOT stored here. See data/README.md for how to configure
    # ~/.kaggle/kaggle.json or the KAGGLE_USERNAME / KAGGLE_KEY env vars.

  # 4 tumor classes, in the exact order used for label indices everywhere in the project.
  class_names: ["glioma", "meningioma", "notumor", "pituitary"]

  # Training folder is split into train/val; Testing folder is left untouched.
  val_split: 0.15
  split_strategy: "stratified_image_level"   # patient-level not feasible: no patient IDs in this dataset
  seed: 42                                    # controls shuffling + split reproducibility

  image_size: 300   # EfficientNet-B3 standard input resolution

  # Normalization: ImageNet stats (we use an ImageNet-pretrained EfficientNet-B3 backbone).
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

  # Light augmentation applied to the TRAIN split only (val/test use eval-only transforms).
  augmentation:
    random_horizontal_flip_p: 0.5
    random_rotation_degrees: 15
    color_jitter:
      brightness: 0.1
      contrast: 0.1

  dataloader:
    batch_size: 32
    num_workers: 4
    shuffle_train: true

model:
  architecture: "efficientnet_b3"
  pretrained: true          # load ImageNet-pretrained weights (torchvision)
  num_classes: 4            # must match len(data.class_names)
  freeze_backbone: false    # false = full fine-tune (default); true = feature-extraction only

training:
  epochs: 30
  learning_rate: 0.0001
  optimizer: "adam"            # only Adam implemented for now; kept explicit for future flexibility
  use_class_weights: true      # computed at runtime from the actual train split (no manual EDA needed)
  device: "cuda"                # falls back to cpu automatically if unavailable
  early_stopping:
    patience: 5
    monitor: "val_loss"
  lr_scheduler:
    type: "reduce_on_plateau"
    factor: 0.5
    patience: 2

evaluation:
  num_classes: 4   # kept in sync with model.num_classes / data.class_names

export:
  # target formats: web, mobile, gpu, onnx (TBD)

tracking:
  mlflow:
    enabled: true
    # NOTE: plain filesystem tracking (e.g. "artifacts/mlruns") is deprecated in
    # MLflow 3.x; using a local SQLite backend instead, per MLflow's current guidance.
    tracking_uri: "sqlite:///artifacts/mlruns/mlflow.db"
    experiment_name: "brain_tumor_classification"

logging:
  level: "INFO"   # DEBUG | INFO | WARNING | ERROR
